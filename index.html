<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شعاع الأنوار - نظام الإدارة</title>
  <style>
    :root { --main: #d4af37; --bg: #121212; --card: #1e1e1e; --text: #fff; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 10px; }
    .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; }
    .tab { background: #333; padding: 10px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .tab.active { background: var(--main); color: #000; font-weight: bold; }
    .content { display: none; margin-top: 15px; }
    .content.active { display: block; }
    .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid var(--main); }
    input, textarea { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; background: #2a2a2a; color: #fff; }
    button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-save { background: var(--main); }
    .btn-wa { background: #25d366; color: #fff; }
    .delete-btn { background: #ff4d4d; color: white; padding: 5px 10px; font-size: 11px; float: left; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="tabs">
    <div class="tab active" onclick="show('orders')">📦 الطلبات</div>
    <div class="tab" onclick="show('nawaqis')">⚠️ النواقص</div>
    <div class="tab" onclick="show('clients')">👥 العملاء</div>
    <div class="tab" onclick="show('staff')">👨‍💼 الموظفون</div>
  </div>

  <!-- قسم الطلبات -->
  <div id="orders" class="content active">
    <h3>تسجيل طلب جديد</h3>
    <input type="text" id="oProduct" placeholder="اسم الصنف">
    <input type="text" id="oClient" placeholder="اسم العميل">
    <textarea id="oDesc" placeholder="المواصفات"></textarea>
    <input type="file" accept="image/*" capture="environment" id="oImg">
    <button class="btn-save" onclick="addOrder()">حفظ وإرسال للعميل</button>
    <div id="ordersList"></div>
  </div>

  <!-- قسم النواقص -->
  <div id="nawaqis" class="content">
    <h3>سجل النواقص</h3>
    <input type="text" id="nItem" placeholder="اسم الناقص">
    <button class="btn-save" onclick="addNawaqis()">إضافة للناقص</button>
    <div id="nawaqisList"></div>
  </div>

  <!-- قسم العملاء والموظفين (تم تبسيطهم للسرعة) -->
  <div id="clients" class="content">
     <input type="text" id="cName" placeholder="اسم العميل">
     <input type="tel" id="cPhone" placeholder="رقم الجوال">
     <button class="btn-save" onclick="addClient()">حفظ عميل</button>
     <div id="clientsList"></div>
  </div>

  <div id="staff" class="content">
     <input type="text" id="sName" placeholder="اسم الموظف">
     <button class="btn-save" onclick="addStaff()">إضافة موظف</button>
     <div id="staffList"></div>
  </div>

  <script>
    function show(id) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }

    // منطق النواقص (الحذف التلقائي)
    function addNawaqis() {
      let val = document.getElementById('nItem').value;
      let list = JSON.parse(localStorage.getItem('nawaqis')) || [];
      list.push(val);
      localStorage.setItem('nawaqis', JSON.stringify(list));
      renderNawaqis();
    }
    function renderNawaqis() {
      let list = JSON.parse(localStorage.getItem('nawaqis')) || [];
      let div = document.getElementById('nawaqisList');
      div.innerHTML = list.map((item, i) => `<div class='card'>${item} <button class='delete-btn' onclick='remNawaqis(${i})'>وصل</button></div>`).join('');
    }
    function remNawaqis(i) {
      let list = JSON.parse(localStorage.getItem('nawaqis'));
      list.splice(i, 1);
      localStorage.setItem('nawaqis', JSON.stringify(list));
      renderNawaqis();
    }

    // منطق الطلبات والواتساب
    function addOrder() {
      let p = document.getElementById('oProduct').value;
      let c = document.getElementById('oClient').value;
      let d = document.getElementById('oDesc').value;
      let text = `طلب من شعاع الأنوار: ${p} | العميل: ${c} | المواصفات: ${d}`;
      window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`;
    }

    renderNawaqis();
  </script>
</body>
</html>
