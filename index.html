<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شعاع الأنوار</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
    button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #d4af37; font-weight: bold; }
    .wa-btn { background: #25d366; color: white; }
    .product-card { background: #1e1e1e; padding: 15px; margin: 10px 0; border-radius: 8px; border-right: 4px solid #d4af37; text-align: right; }
  </style>
</head>
<body>
  <h1>شعاع الأنوار</h1>
  <input type="text" id="name" placeholder="اسم المنتج">
  <input type="text" id="price" placeholder="السعر">
  <button onclick="add()">إضافة منتج</button>
  <div id="list"></div>

  <script>
    function add() {
      let n = document.getElementById('name').value;
      let p = document.getElementById('price').value;
      if(!n) return;
      let div = document.createElement('div');
      div.className = 'product-card';
      div.innerHTML = `<div>${n}</div><div style="color:#d4af37">${p}</div><button class="wa-btn" onclick="share('${n}','${p}')">واتساب</button>`;
      document.getElementById('list').appendChild(div);
    }
    function share(n, p) {
      window.location.href = "whatsapp://send?text=المنتج: " + n + " السعر: " + p;
    }
  </script>
</body>
</html>
